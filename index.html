<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aether AI — Futuristic AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    header h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 5px;
    }

    #chat-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      padding: 14px 18px;
      border-radius: 12px;
      max-width: 80%;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user-message {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .bot-message {
      align-self: flex-start;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-bottom-left-radius: 2px;
    }

    .system-error {
      background: #451a1a;
      border: 1px solid #991b1b;
      color: #fca5a5;
    }

    #input-container {
      padding: 20px;
      background: #111827;
      border-top: 1px solid #1f2937;
      display: flex;
      justify-content: center;
    }

    #chat-form {
      display: flex;
      width: 100%;
      max-width: 800px;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }

    #user-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    button {
      padding: 14px 24px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      background: #334155;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>Aether AI</h1>
    <p>Next-Gen Intelligent Assistant</p>
  </header>

  <div id="chat-container">
    <div class="message bot-message">
      Greetings, human. I am Aether AI. How may I assist you today?
    </div>
  </div>

  <div id="input-container">
    <form id="chat-form">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Type your message..." 
        autocomplete="off" 
        required 
      />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(text, className) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', className);
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      addMessage(message, 'user-message');
      userInput.value = '';
      sendBtn.disabled = true;

      const loadingDiv = document.createElement('div');
      loadingDiv.classList.add('message', 'bot-message');
      loadingDiv.textContent = 'Thinking...';
      chatContainer.appendChild(loadingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ message: message }),
        });

        const data = await response.json();
        chatContainer.removeChild(loadingDiv);

        if (response.ok && data.reply) {
          addMessage(data.reply, 'bot-message');
        } else {
          addMessage(`Error: ${data.error || 'Failed to get response.'}`, 'message system-error');
        }
      } catch (err) {
        chatContainer.removeChild(loadingDiv);
        addMessage(`Connection error: ${err.message}`, 'message system-error');
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
